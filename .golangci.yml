run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - gofmt

linters-settings:
  errcheck:
    check-blank: false
  govet:
    enable-all: true
    disable:
      - shadow

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
