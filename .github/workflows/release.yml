name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      # Create GitHub Release and upload release assets (GoReleaser, gh, SBOM).
      contents: write
      # Push container images to GHCR.
      packages: write
      # Keyless cosign signing and provenance attestation (OIDC).
      id-token: write
      # Publish build provenance attestations.
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.5.2
      
      - name: Install syft
        run: |
          set -euo pipefail
          SYFT_VERSION=1.55.0
          SYFT_SHA256=bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d
          curl -fsSL -o /tmp/syft.tgz \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  /tmp/syft.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/syft.tgz -C /usr/local/bin syft
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Install blastguard and grype
        run: |
          set -euo pipefail
          tar -xzf dist/blastguard_*_linux_amd64.tar.gz -C /tmp
          chmod +x /tmp/blastguard
          GRYPE_VERSION=0.121.0
          GRYPE_SHA256=64e07133d3486115de647a66581461dccf5c732748a0a3119077395565f15519
          curl -fsSL -o /tmp/grype.tgz \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          echo "${GRYPE_SHA256}  /tmp/grype.tgz" | sha256sum -c -
          tar -xzf /tmp/grype.tgz -C /tmp grype
      
      - name: Generate SBOM for release
        run: |
          syft dist/blastguard_*_linux_amd64.tar.gz -o cyclonedx-json > /tmp/release-sbom.json
      
      - name: Scan release with Grype
        run: |
          set -euo pipefail
          /tmp/grype dist/blastguard_*_linux_amd64.tar.gz -o json > /tmp/release-grype.json
      
      - name: Dogfood blastguard on its own release
        run: |
          set -euo pipefail
          /tmp/blastguard ingest \
            --sbom-cyclonedx /tmp/release-sbom.json \
            --vulns-grype /tmp/release-grype.json \
            --output /tmp/release-twin.json

          echo "## BlastGuard Self-Scan Report" > /tmp/dogfood-report.md
          echo "" >> /tmp/dogfood-report.md
          echo "This release was scanned with BlastGuard itself:" >> /tmp/dogfood-report.md
          echo "" >> /tmp/dogfood-report.md
          echo '```json' >> /tmp/dogfood-report.md
          jq '{cves: (.cves | length), packages: (.artifacts[0].packages | length), inventory_complete}' /tmp/release-twin.json >> /tmp/dogfood-report.md
          echo '```' >> /tmp/dogfood-report.md
          echo "" >> /tmp/dogfood-report.md
          echo "### Policy decisions" >> /tmp/dogfood-report.md

          # Assert policy on every CVE: fail on BLOCK/QUARANTINE/UNKNOWN unless
          # VEX (or no-blast-radius) yields ALLOW/WARN.
          mapfile -t CVES < <(jq -r '.cves[].id // empty' /tmp/release-twin.json)
          if [ "${#CVES[@]}" -eq 0 ]; then
            echo "No CVEs in release twin — dogfood policy gate has nothing to assert" >> /tmp/dogfood-report.md
          fi
          for CVE in "${CVES[@]}"; do
            [ -n "$CVE" ] || continue
            set +e
            /tmp/blastguard ingest \
              --sbom-cyclonedx /tmp/release-sbom.json \
              --vulns-grype /tmp/release-grype.json \
              --policy config/decision-policy.json \
              --trace "$CVE" \
              --output json \
              > /tmp/decision-"$CVE".json \
              2>/tmp/decision-"$CVE".err
            CODE=$?
            set -e
            ACTION=$(jq -r '.action // empty' /tmp/decision-"$CVE".json)
            RULE=$(jq -r '.rule_id // empty' /tmp/decision-"$CVE".json)
            echo "- \`$CVE\` → **$ACTION** (\`$RULE\`, exit=$CODE)" >> /tmp/dogfood-report.md
            case "$ACTION" in
              BLOCK|QUARANTINE|UNKNOWN)
                echo "ERROR: dogfood policy gate rejected $CVE action=$ACTION rule=$RULE" >&2
                cat /tmp/decision-"$CVE".json >&2 || true
                cat /tmp/decision-"$CVE".err >&2 || true
                exit 1
                ;;
              ALLOW|WARN)
                ;;
              *)
                echo "ERROR: dogfood policy gate got unexpected action='$ACTION' for $CVE" >&2
                cat /tmp/decision-"$CVE".json >&2 || true
                exit 1
                ;;
            esac
          done
      
      - name: Upload dogfood report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dogfood-report
          path: /tmp/dogfood-report.md
      
      - name: Attach dogfood report to release
        run: |
          gh release upload ${{ github.ref_name }} /tmp/dogfood-report.md /tmp/release-twin.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install crane
        run: |
          set -euo pipefail
          CRANE_VERSION=v0.20.6
          CRANE_SHA256=c1d593d01551f2c9a3df5ca0a0be4385a839bd9b86d4a76e18d7b17d16559127
          curl -fsSL -o /tmp/gcr.tgz \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  /tmp/gcr.tgz" | sha256sum -c -
          sudo tar -xz -C /usr/local/bin -f /tmp/gcr.tgz crane

      - name: Generate SPDX SBOM for image
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/justrunme/blastguard:${{ github.ref_name }}
          format: spdx-json
          artifact-name: blastguard-sbom.spdx.json
          output-file: blastguard-sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Attach SPDX SBOM to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" blastguard-sbom.spdx.json --clobber

      - name: Resolve image digest
        id: digest
        run: |
          set -euo pipefail
          DIGEST="$(crane digest "ghcr.io/justrunme/blastguard:${GITHUB_REF_NAME}")"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/justrunme/blastguard
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Ensure image signature
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/justrunme/blastguard@${{ steps.digest.outputs.digest }}"
          if ! cosign verify \
            --certificate-identity-regexp="^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            "${IMAGE}" >/dev/null 2>&1; then
            cosign sign --yes --registry-referrers-mode=legacy "${IMAGE}"
          fi
          cosign verify \
            --certificate-identity-regexp="^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            "${IMAGE}"
