name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      
      - name: Install syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Install blastguard and grype
        run: |
          tar -xzf dist/blastguard_*_linux_amd64.tar.gz -C /tmp
          chmod +x /tmp/blastguard
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /tmp
      
      - name: Generate SBOM for release
        run: |
          syft dist/blastguard_*_linux_amd64.tar.gz -o cyclonedx-json > /tmp/release-sbom.json
      
      - name: Scan release with Grype
        run: |
          /tmp/grype dist/blastguard_*_linux_amd64.tar.gz -o json > /tmp/release-grype.json || true
      
      - name: Dogfood blastguard on its own release
        run: |
          /tmp/blastguard ingest \
            --sbom-cyclonedx /tmp/release-sbom.json \
            --vulns-grype /tmp/release-grype.json \
            --output /tmp/release-twin.json
          
          echo "## BlastGuard Self-Scan Report" > /tmp/dogfood-report.md
          echo "" >> /tmp/dogfood-report.md
          echo "This release was scanned with BlastGuard itself:" >> /tmp/dogfood-report.md
          echo "" >> /tmp/dogfood-report.md
          echo '```json' >> /tmp/dogfood-report.md
          cat /tmp/release-twin.json | jq '{cves: (.cves | length), packages: (.artifacts[0].packages | length)}' >> /tmp/dogfood-report.md
          echo '```' >> /tmp/dogfood-report.md
      
      - name: Upload dogfood report
        uses: actions/upload-artifact@v7
        with:
          name: dogfood-report
          path: /tmp/dogfood-report.md
      
      - name: Attach dogfood report to release
        run: |
          gh release upload ${{ github.ref_name }} /tmp/dogfood-report.md /tmp/release-twin.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install crane
        run: |
          curl -fsSL https://github.com/google/go-containerregistry/releases/download/v0.20.6/go-containerregistry_Linux_x86_64.tar.gz \
            | sudo tar -xz -C /usr/local/bin crane

      - name: Generate SPDX SBOM for image
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/justrunme/blastguard:${{ github.ref_name }}
          format: spdx-json
          artifact-name: blastguard-sbom.spdx.json
          output-file: blastguard-sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Attach SPDX SBOM to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" blastguard-sbom.spdx.json --clobber

      - name: Resolve image digest
        id: digest
        run: |
          set -euo pipefail
          DIGEST="$(crane digest "ghcr.io/justrunme/blastguard:${GITHUB_REF_NAME}")"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/justrunme/blastguard
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Ensure image signature
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/justrunme/blastguard@${{ steps.digest.outputs.digest }}"
          if ! cosign verify \
            --certificate-identity-regexp="^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            "${IMAGE}" >/dev/null 2>&1; then
            cosign sign --yes --registry-referrers-mode=legacy "${IMAGE}"
          fi
          cosign verify \
            --certificate-identity-regexp="^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            "${IMAGE}"
