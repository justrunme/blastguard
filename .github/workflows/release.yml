name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      
      - name: Install syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Install blastguard and grype
        run: |
          tar -xzf dist/blastguard_*_linux_amd64.tar.gz -C /tmp
          chmod +x /tmp/blastguard
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /tmp
      
      - name: Generate SBOM for release
        run: |
          syft dist/blastguard_*_linux_amd64.tar.gz -o cyclonedx-json > /tmp/release-sbom.json
      
      - name: Scan release with Grype
        run: |
          /tmp/grype dist/blastguard_*_linux_amd64.tar.gz -o json > /tmp/release-grype.json || true
      
      - name: Dogfood blastguard on its own release
        run: |
          /tmp/blastguard ingest \
            --sbom-cyclonedx /tmp/release-sbom.json \
            --vulns-grype /tmp/release-grype.json \
            --output /tmp/release-twin.json
          
          echo "## BlastGuard Self-Scan Report" > /tmp/dogfood-report.md
          echo "" >> /tmp/dogfood-report.md
          echo "This release was scanned with BlastGuard itself:" >> /tmp/dogfood-report.md
          echo "" >> /tmp/dogfood-report.md
          echo '```json' >> /tmp/dogfood-report.md
          cat /tmp/release-twin.json | jq '{cves: (.cves | length), packages: (.artifacts[0].packages | length)}' >> /tmp/dogfood-report.md
          echo '```' >> /tmp/dogfood-report.md
      
      - name: Upload dogfood report
        uses: actions/upload-artifact@v7
        with:
          name: dogfood-report
          path: /tmp/dogfood-report.md
      
      - name: Attach dogfood report to release
        run: |
          gh release upload ${{ github.ref_name }} /tmp/dogfood-report.md /tmp/release-twin.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
