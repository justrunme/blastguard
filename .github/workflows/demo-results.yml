name: Demo results

on:
  workflow_dispatch:
  schedule:
    - cron: "27 5 * * 1"

jobs:
  record-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install recorders
        run: |
          python -m pip install asciinema
          npm install -g svg-term-cli
      - name: Build and record
        run: |
          go build -o bin/blastguard ./cmd/blastguard
          mkdir -p docs/assets
          asciinema rec --overwrite -c './bin/blastguard demo CVE-2026-1234; echo; ./bin/blastguard prove' docs/assets/demo-scan.cast
          svg-term --in docs/assets/demo-scan.cast --out docs/assets/demo-scan.svg --window --width 80 --height 28 --no-cursor
          ./bin/blastguard demo CVE-2026-1234 | tee /tmp/demo.out
          python3 scripts/write_demo_results.py
      - uses: actions/upload-artifact@v4
        with:
          name: demo-results
          path: |
            docs/assets/demo-scan.cast
            docs/assets/demo-scan.svg
            docs/results.json
