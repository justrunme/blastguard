name: Demo results

on:
  workflow_dispatch:
  schedule:
    - cron: "27 5 * * 1"

permissions:
  contents: read

jobs:
  record-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install recorders
        run: |
          python -m pip install asciinema==2.4.0
          npm install -g svg-term-cli@2.1.1
      - name: Build and record
        run: |
          go build -o bin/blastguard ./cmd/blastguard
          mkdir -p docs/assets
          asciinema rec --overwrite -c './bin/blastguard demo CVE-2026-1234; echo; ./bin/blastguard prove' docs/assets/demo-scan.cast
          svg-term --in docs/assets/demo-scan.cast --out docs/assets/demo-scan.svg --window --width 80 --height 28 --no-cursor
          ./bin/blastguard demo CVE-2026-1234 | tee /tmp/demo.out
          python3 scripts/write_demo_results.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-results
          path: |
            docs/assets/demo-scan.cast
            docs/assets/demo-scan.svg
            docs/results.json
