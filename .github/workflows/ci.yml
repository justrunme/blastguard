name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install Syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b ./bin
      - name: Install Grype
        run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b ./bin
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          install-mode: goinstall
      - name: go test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Build
        run: go build -o bin/blastguard ./cmd/blastguard
      - name: Demo test
        run: |
          set +e
          ./bin/blastguard demo CVE-2026-1234 --output json > /tmp/demo.json
          code=$?
          set -e
          cat /tmp/demo.json
          jq -e '.action == "BLOCK"' /tmp/demo.json
          test "$code" -eq 2
      - name: Prove remediation
        run: |
          ./bin/blastguard prove | grep -q 'REMEDIATION PROVED'
      - name: Exit codes / fail-on warn
        run: |
          set +e
          ./bin/blastguard demo CVE-2026-2345 --output json > /tmp/warn.json
          code=$?
          set -e
          # MEDIUM reachable → WARN → exit 0 without --fail-on
          test "$code" -eq 0
          set +e
          ./bin/blastguard demo CVE-2026-2345 --fail-on warn >/dev/null
          code=$?
          set -e
          test "$code" -eq 1
      - name: Test ingest
        run: |
          ./bin/syft alpine:3.20 -o cyclonedx-json > /tmp/alpine-cdx.json 2>/dev/null
          ./bin/grype alpine:3.20 -o json 2>/dev/null > /tmp/alpine-grype.json
          ./bin/blastguard ingest --sbom-cyclonedx /tmp/alpine-cdx.json --vulns-grype /tmp/alpine-grype.json > /tmp/twin.json
          test -s /tmp/twin.json
  
  e2e-kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
      - name: Install Syft and Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b ./bin
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b ./bin
      - name: Create kind cluster
        run: kind create cluster --name blastguard-test
      - name: Build
        run: go build -o bin/blastguard ./cmd/blastguard
      - name: Deploy test workloads
        run: |
          kubectl create deployment payment-api --image=nginx:alpine --replicas=2
          kubectl label deployment payment-api blastguard.io/critical=true
          kubectl expose deployment payment-api --port=80 --type=LoadBalancer
          kubectl create deployment internal-worker --image=nginx:alpine --replicas=1
          kubectl wait --for=condition=available --timeout=60s deployment/payment-api
          kubectl wait --for=condition=available --timeout=60s deployment/internal-worker
      - name: Generate SBOM and scan for vulnerabilities
        run: |
          ./bin/syft nginx:alpine -o cyclonedx-json > /tmp/nginx-sbom.json 2>/dev/null
          ./bin/grype nginx:alpine -o json 2>/dev/null > /tmp/nginx-vulns.json
      - name: Scan cluster and build twin
        run: |
          ./bin/blastguard ingest \
            --sbom-cyclonedx /tmp/nginx-sbom.json \
            --vulns-grype /tmp/nginx-vulns.json \
            --from-cluster \
            --output /tmp/cluster-twin.json
          cat /tmp/cluster-twin.json
          test $(jq '.workloads | length' /tmp/cluster-twin.json) -ge 2
      - name: Test exposure decisions
        run: |
          set -euo pipefail
          CVE=$(jq -r '[.cves[] | select((.severity|ascii_upcase)=="HIGH" or (.severity|ascii_upcase)=="CRITICAL")] | .[0].id' /tmp/cluster-twin.json)
          if [ -z "$CVE" ] || [ "$CVE" = "null" ]; then
            echo "No HIGH/CRITICAL CVE in nginx:alpine twin, cannot test decisions"
            jq '.cves' /tmp/cluster-twin.json
            exit 1
          fi
          echo "Testing decisions for $CVE on exposed vs internal workloads"

          PAYMENT_EXPOSED=$(jq -r '.workloads[] | select(.name == "payment-api") | .internet_exposed' /tmp/cluster-twin.json)
          WORKER_EXPOSED=$(jq -r '.workloads[] | select(.name == "internal-worker") | .internet_exposed' /tmp/cluster-twin.json)
          PAYMENT_REACHABLE=$(jq -r '.workloads[] | select(.name == "payment-api") | .reachable_path' /tmp/cluster-twin.json)
          echo "payment-api exposed: $PAYMENT_EXPOSED reachable: $PAYMENT_REACHABLE"
          echo "internal-worker exposed: $WORKER_EXPOSED"
          test "$PAYMENT_EXPOSED" = "true" || { echo "ERROR: payment-api should be exposed"; exit 1; }
          test "$PAYMENT_REACHABLE" = "true" || { echo "ERROR: payment-api should be reachable (no default-deny NP)"; exit 1; }
          test "$WORKER_EXPOSED" = "false" || { echo "ERROR: internal-worker should not be exposed"; exit 1; }

          set +e
          ./bin/blastguard ingest \
            --sbom-cyclonedx /tmp/nginx-sbom.json \
            --vulns-grype /tmp/nginx-vulns.json \
            --from-cluster \
            --policy config/decision-policy.json \
            --output /tmp/payment-twin.json \
            --trace "$CVE" \
            --workload payment-api \
            2>&1 | tee /tmp/payment-decision.out
          PAYMENT_CODE=${PIPESTATUS[0]}
          set -e
          PAYMENT_DECISION=$(grep -E '^DECISION ' /tmp/payment-decision.out | awk '{print $2}')
          echo "payment-api decision: $PAYMENT_DECISION exit=$PAYMENT_CODE"
          test "$PAYMENT_DECISION" = "BLOCK" || { echo "ERROR: expected BLOCK for payment-api, got ${PAYMENT_DECISION:-empty}"; cat /tmp/payment-decision.out; exit 1; }
          test "$PAYMENT_CODE" -eq 2 || { echo "ERROR: expected exit 2 for BLOCK, got $PAYMENT_CODE"; exit 1; }

          set +e
          ./bin/blastguard ingest \
            --sbom-cyclonedx /tmp/nginx-sbom.json \
            --vulns-grype /tmp/nginx-vulns.json \
            --from-cluster \
            --policy config/decision-policy.json \
            --output /tmp/worker-twin.json \
            --trace "$CVE" \
            --workload internal-worker \
            2>&1 | tee /tmp/worker-decision.out
          WORKER_CODE=${PIPESTATUS[0]}
          set -e
          WORKER_DECISION=$(grep -E '^DECISION ' /tmp/worker-decision.out | awk '{print $2}')
          echo "internal-worker decision: $WORKER_DECISION exit=$WORKER_CODE"
          test "$WORKER_DECISION" = "WARN" || { echo "ERROR: expected WARN for internal-worker, got ${WORKER_DECISION:-empty}"; cat /tmp/worker-decision.out; exit 1; }
          test "$WORKER_CODE" -eq 0 || { echo "ERROR: expected exit 0 for WARN without --fail-on, got $WORKER_CODE"; exit 1; }

          echo "✓ same CVE $CVE → BLOCK on payment-api, WARN on internal-worker"

      - name: OpenVEX not_affected flips decision for matching digest
        run: |
          set -euo pipefail
          CVE=$(jq -r '[.cves[] | select((.severity|ascii_upcase)=="HIGH" or (.severity|ascii_upcase)=="CRITICAL")] | .[0].id' /tmp/cluster-twin.json)
          DIGEST=$(jq -r '.artifacts[] | select(.image|test("nginx")) | .digest' /tmp/cluster-twin.json | head -1)
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
            # fall back to grype/syft image id if twin omitted digest
            DIGEST=$(./bin/syft nginx:alpine -o json 2>/dev/null | jq -r '.source.image.digest // empty' || true)
          fi
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
            DIGEST=$(jq -r '.source.target.imageID // empty' /tmp/nginx-vulns.json)
          fi
          test -n "$DIGEST" && test "$DIGEST" != "null"
          echo "Using digest $DIGEST for CVE $CVE"
          cat > /tmp/nginx-openvex.json <<JSON
          {
            "@context": "https://openvex.dev/ns/v0.2.0",
            "@id": "https://example.com/vex/nginx-e2e",
            "author": "blastguard-ci",
            "timestamp": "2026-10-11T00:00:00Z",
            "version": "1",
            "statements": [
              {
                "vulnerability": { "name": "$CVE" },
                "products": [ { "@id": "pkg:oci/nginx@$DIGEST" } ],
                "status": "not_affected",
                "justification": "vulnerable_code_not_in_execute_path"
              }
            ]
          }
          JSON
          # Prefix digest must NOT flip (substring/suffix match regression)
          HEX="${DIGEST#sha256:}"
          WRONG="sha256:${HEX:0:8}"
          cat > /tmp/nginx-openvex-wrong.json <<JSON
          {
            "@context": "https://openvex.dev/ns/v0.2.0",
            "@id": "https://example.com/vex/nginx-wrong",
            "author": "blastguard-ci",
            "timestamp": "2026-10-11T00:00:00Z",
            "version": "1",
            "statements": [
              {
                "vulnerability": { "name": "$CVE" },
                "products": [ { "@id": "pkg:oci/nginx@$WRONG" } ],
                "status": "not_affected",
                "justification": "vulnerable_code_not_in_execute_path"
              }
            ]
          }
          JSON
          set +e
          ./bin/blastguard ingest \
            --sbom-cyclonedx /tmp/nginx-sbom.json \
            --vulns-grype /tmp/nginx-vulns.json \
            --from-cluster \
            --vex /tmp/nginx-openvex-wrong.json \
            --policy config/decision-policy.json \
            --output /tmp/vex-wrong-twin.json \
            --trace "$CVE" \
            --workload payment-api \
            2>&1 | tee /tmp/vex-wrong.out
          WRONG_CODE=${PIPESTATUS[0]}
          set -e
          WRONG_DECISION=$(grep -E '^DECISION ' /tmp/vex-wrong.out | awk '{print $2}')
          test "$WRONG_DECISION" = "BLOCK" || { echo "ERROR: wrong digest must keep BLOCK, got ${WRONG_DECISION:-empty}"; exit 1; }
          # Prefix VEX must not flip to ALLOW — exit must remain non-zero for BLOCK (2)
          test "$WRONG_CODE" -eq 2 || { echo "ERROR: expected exit 2 for BLOCK with prefix digest, got $WRONG_CODE"; exit 1; }

          set +e
          ./bin/blastguard ingest \
            --sbom-cyclonedx /tmp/nginx-sbom.json \
            --vulns-grype /tmp/nginx-vulns.json \
            --from-cluster \
            --vex /tmp/nginx-openvex.json \
            --policy config/decision-policy.json \
            --output /tmp/vex-ok-twin.json \
            --trace "$CVE" \
            --workload payment-api \
            2>&1 | tee /tmp/vex-ok.out
          OK_CODE=${PIPESTATUS[0]}
          set -e
          OK_DECISION=$(grep -E '^DECISION ' /tmp/vex-ok.out | awk '{print $2}')
          echo "matching digest VEX decision: $OK_DECISION exit=$OK_CODE"
          test "$OK_DECISION" = "ALLOW" || { echo "ERROR: expected ALLOW after not_affected for matching digest, got ${OK_DECISION:-empty}"; cat /tmp/vex-ok.out; exit 1; }
          test "$OK_CODE" -eq 0 || { echo "ERROR: expected exit 0 for ALLOW, got $OK_CODE"; exit 1; }
          echo "✓ OpenVEX not_affected flips BLOCK→ALLOW only for matching digest"

      - name: Install cosign and local registry
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64 -o /tmp/cosign
          chmod +x /tmp/cosign
          sudo mv /tmp/cosign /usr/local/bin/cosign
          # Allow HTTP registry on localhost:5001
          sudo mkdir -p /etc/docker
          if [ -f /etc/docker/daemon.json ]; then
            sudo jq '. + {"insecure-registries": ((.["insecure-registries"] // []) + ["localhost:5001"] | unique)}' /etc/docker/daemon.json > /tmp/daemon.json
            sudo mv /tmp/daemon.json /etc/docker/daemon.json
          else
            echo '{"insecure-registries":["localhost:5001"]}' | sudo tee /etc/docker/daemon.json
          fi
          sudo systemctl restart docker || sudo service docker restart || true
          docker run -d --name bg-registry -p 5001:5000 registry:2

      - name: OpenVEX attestation verify (key) applies; wrong key rejected
        run: |
          set -euo pipefail
          export PATH="$PWD/bin:$PATH"
          CVE=$(jq -r '[.cves[] | select((.severity|ascii_upcase)=="HIGH" or (.severity|ascii_upcase)=="CRITICAL")] | .[0].id' /tmp/cluster-twin.json)
          DIGEST=$(jq -r '.artifacts[] | select(.image|test("nginx")) | .digest' /tmp/cluster-twin.json | head -1)
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
            DIGEST=$(jq -r '.source.target.imageID // empty' /tmp/nginx-vulns.json)
          fi
          test -n "$DIGEST" && test "$DIGEST" != "null"

          # Retag nginx into local registry and push
          REG=localhost:5001
          docker pull nginx:alpine
          docker tag nginx:alpine "$REG/nginx:alpine"
          docker push "$REG/nginx:alpine"
          IMG="$REG/nginx:alpine"

          mkdir -p /tmp/cosign-good /tmp/cosign-bad
          (cd /tmp/cosign-good && COSIGN_PASSWORD= cosign generate-key-pair)
          (cd /tmp/cosign-bad && COSIGN_PASSWORD=bad cosign generate-key-pair)

          cat > /tmp/att-openvex.json <<JSON
          {
            "@context": "https://openvex.dev/ns/v0.2.0",
            "@id": "https://example.com/vex/nginx-att",
            "author": "blastguard-ci",
            "timestamp": "2026-10-11T00:00:00Z",
            "version": "1",
            "statements": [
              {
                "vulnerability": { "name": "$CVE" },
                "products": [ { "@id": "pkg:oci/nginx@$DIGEST" } ],
                "status": "not_affected",
                "justification": "vulnerable_code_not_in_execute_path"
              }
            ]
          }
          JSON

          # Sign OpenVEX as attestation predicate
          COSIGN_PASSWORD= cosign attest --yes --allow-insecure-registry --type openvex --predicate /tmp/att-openvex.json --key /tmp/cosign-good/cosign.key "$IMG"

          # Good key must verify + apply
          set +e
          ./bin/blastguard ingest \
            --sbom-cyclonedx /tmp/nginx-sbom.json \
            --vulns-grype /tmp/nginx-vulns.json \
            --from-cluster \
            --vex-attestation "$IMG" \
            --key /tmp/cosign-good/cosign.pub \
            --policy config/decision-policy.json \
            --output /tmp/vex-att-ok-twin.json \
            --trace "$CVE" \
            --workload payment-api \
            2>&1 | tee /tmp/vex-att-ok.out
          OK_CODE=${PIPESTATUS[0]}
          set -e
          grep -E 'Applied OpenVEX attestation' /tmp/vex-att-ok.out | grep -E '[1-9][0-9]* statement' 
          OK_DECISION=$(grep -E '^DECISION ' /tmp/vex-att-ok.out | awk '{print $2}')
          test "$OK_DECISION" = "ALLOW" || { echo "ERROR: verified attestation should ALLOW, got ${OK_DECISION:-empty}"; cat /tmp/vex-att-ok.out; exit 1; }
          test "$OK_CODE" -eq 0

          # Wrong key must be rejected (fail closed — no apply)
          set +e
          ./bin/blastguard ingest \
            --sbom-cyclonedx /tmp/nginx-sbom.json \
            --vulns-grype /tmp/nginx-vulns.json \
            --from-cluster \
            --vex-attestation "$IMG" \
            --key /tmp/cosign-bad/cosign.pub \
            --policy config/decision-policy.json \
            --output /tmp/vex-att-bad-twin.json \
            --trace "$CVE" \
            --workload payment-api \
            2>&1 | tee /tmp/vex-att-bad.out
          BAD_CODE=${PIPESTATUS[0]}
          set -e
          test "$BAD_CODE" -ne 0 || { echo "ERROR: wrong key must fail closed"; cat /tmp/vex-att-bad.out; exit 1; }
          grep -qi 'verify failed\|trust material\|UNVERIFIED\|no matching' /tmp/vex-att-bad.out || \
            { echo "ERROR: expected verify failure message"; cat /tmp/vex-att-bad.out; exit 1; }
          echo "✓ OpenVEX attestation: good key applies, wrong key rejected"

