<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">BlastGuard lifecycle</title>
  <desc id="desc">Discover, Trace, Decide, Enforce, Verify - supply chain blast-radius control plane.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1020"/>
      <stop offset="55%" stop-color="#111b30"/>
      <stop offset="100%" stop-color="#0d1528"/>
    </linearGradient>
    <linearGradient id="accentG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7dd3fc"/>
    </marker>
    <marker id="arrowHot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb7185"/>
    </marker>
    <style>
      .title { font: 800 26px ui-sans-serif, system-ui, sans-serif; fill: #f1f5f9; }
      .sub { font: 500 13px ui-sans-serif, system-ui, sans-serif; fill: #94a3b8; }
      .chip { font: 700 10px ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .stage { font: 800 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #e2e8f0; letter-spacing: .04em; }
      .metric { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #94a3b8; }
      .box { fill: #0f1a2d; stroke: #3b536f; stroke-width: 1.6; }
      .boxHot { fill: #1c1018; stroke: #fb7185; stroke-width: 1.8; }
      .boxOk { fill: #052e1c; stroke: #34d399; stroke-width: 1.8; }
      .flow { fill: none; stroke: #7dd3fc; stroke-width: 2.2; marker-end: url(#arrow); }
      .flowHot { fill: none; stroke: #fb7185; stroke-width: 2.4; marker-end: url(#arrowHot); }
      .flowDim { fill: none; stroke: #475569; stroke-width: 1.6; stroke-dasharray: 4 4; opacity: .55; }
      .card-t { font: 700 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #7dd3fc; letter-spacing: .1em; }
      .row { font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #cbd5e1; }
      .hot { fill: #fb7185; }
      .ok { fill: #34d399; }
      .tiny { font: 600 10px ui-sans-serif, system-ui, sans-serif; fill: #64748b; letter-spacing: .04em; }
      .node { font: 700 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #e2e8f0; }
    </style>
  </defs>

  <rect width="1120" height="620" fill="url(#bg)"/>
  <text x="40" y="42" class="title">BlastGuard</text>
  <text x="40" y="66" class="sub">A CVE is not a risk until you know where it can reach</text>
  <rect x="40" y="80" width="360" height="22" rx="11" fill="url(#accentG)"/>
  <text x="220" y="95" text-anchor="middle" class="chip">DISCOVER - TRACE - DECIDE - ENFORCE - VERIFY</text>

  <!-- lifecycle stages -->
  <g filter="url(#soft)">
    <rect class="box" x="40" y="130" width="190" height="88" rx="12"/>
    <text x="135" y="165" text-anchor="middle" class="stage">DISCOVER</text>
    <text x="135" y="190" text-anchor="middle" class="metric">SBOM / CVE / Sigstore</text>
  </g>
  <path class="flow" d="M240 174 H270"/>
  <g filter="url(#soft)">
    <rect class="box" x="280" y="130" width="190" height="88" rx="12"/>
    <text x="375" y="165" text-anchor="middle" class="stage">TRACE</text>
    <text x="375" y="190" text-anchor="middle" class="metric">graph blast radius</text>
  </g>
  <path class="flow" d="M480 174 H510"/>
  <g filter="url(#soft)">
    <rect class="boxHot" x="520" y="130" width="190" height="88" rx="12"/>
    <text x="615" y="165" text-anchor="middle" class="stage">DECIDE</text>
    <text x="615" y="190" text-anchor="middle" class="metric">BLOCK / WARN / ALLOW</text>
  </g>
  <path class="flow" d="M720 174 H750"/>
  <g filter="url(#soft)">
    <rect class="box" x="760" y="130" width="150" height="88" rx="12"/>
    <text x="835" y="165" text-anchor="middle" class="stage">ENFORCE</text>
    <text x="835" y="190" text-anchor="middle" class="metric">admission</text>
  </g>
  <path class="flow" d="M920 174 H950"/>
  <g filter="url(#soft)">
    <rect class="boxOk" x="960" y="130" width="120" height="88" rx="12"/>
    <text x="1020" y="165" text-anchor="middle" class="stage" style="fill:#ecfdf5">VERIFY</text>
    <text x="1020" y="190" text-anchor="middle" class="metric" style="fill:#a7f3d0">PROVED</text>
  </g>

  <!-- left attack path graph -->
  <g filter="url(#soft)" transform="translate(40 250)">
    <rect x="0" y="0" width="520" height="330" rx="16" fill="#0f1a2d" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="32" class="card-t">CRITICAL PATH</text>
    <rect class="boxHot" x="24" y="56" width="140" height="40" rx="8"/>
    <text x="94" y="82" text-anchor="middle" class="node">CVE-2026-1234</text>
    <path class="flowHot" d="M94 96 V120"/>
    <rect class="boxHot" x="24" y="120" width="140" height="36" rx="8"/>
    <text x="94" y="143" text-anchor="middle" class="node">openssl</text>
    <path class="flowHot" d="M94 156 V180"/>
    <rect class="boxHot" x="24" y="180" width="200" height="36" rx="8"/>
    <text x="124" y="203" text-anchor="middle" class="node">payment-api:v41</text>
    <path class="flowHot" d="M124 216 V240"/>
    <rect class="boxHot" x="24" y="240" width="200" height="36" rx="8"/>
    <text x="124" y="263" text-anchor="middle" class="node">prod/payment-api</text>
    <path class="flowHot" d="M124 276 V300"/>
    <rect class="boxHot" x="24" y="300" width="200" height="36" rx="8"/>
    <text x="124" y="323" text-anchor="middle" class="node">public-ingress</text>

    <!-- pruned paths -->
    <path class="flowDim" d="M260 76 H340"/>
    <text x="350" y="80" class="tiny">VEX not_affected</text>
    <path class="flowDim" d="M260 140 H340"/>
    <text x="350" y="144" class="tiny">not running</text>
    <path class="flowDim" d="M260 200 H340"/>
    <text x="350" y="204" class="tiny">not reachable</text>
    <text x="260" y="280" class="metric">38 findings pruned to 1 path</text>
  </g>

  <!-- right decision card -->
  <g filter="url(#soft)" transform="translate(580 250)">
    <rect x="0" y="0" width="500" height="330" rx="16" fill="#0f1a2d" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="32" class="card-t">BLASTGUARD DECISION</text>
    <circle cx="468" cy="26" r="5" fill="#fb7185">
      <animate attributeName="opacity" values="1;.35;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="24" y="70" class="row">CVE-2026-1234</text>
    <text x="24" y="100" class="row">SBOM</text><text x="460" y="100" text-anchor="end" class="row ok">VERIFIED</text>
    <text x="24" y="128" class="row">PROVENANCE</text><text x="460" y="128" text-anchor="end" class="row ok">VERIFIED</text>
    <text x="24" y="156" class="row">Affected</text><text x="460" y="156" text-anchor="end" class="row">3</text>
    <text x="24" y="184" class="row">Running</text><text x="460" y="184" text-anchor="end" class="row">2</text>
    <text x="24" y="212" class="row">Reachable</text><text x="460" y="212" text-anchor="end" class="row hot">1</text>
    <text x="24" y="240" class="row">Exploitable</text><text x="460" y="240" text-anchor="end" class="row hot">1</text>
    <line x1="24" y1="258" x2="476" y2="258" stroke="#334155"/>
    <text x="24" y="290" class="row hot">POLICY  BLOCK</text>
    <text x="24" y="316" class="tiny">FIX payment-api:v42  -  after patch: REMEDIATION PROVED</text>
  </g>
</svg>
